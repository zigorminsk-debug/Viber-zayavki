plugins {
    id 'com.android.application'
}

// Пароли keystores: в CI передаются секретами GitHub (KS_PASS_*),
// по умолчанию — прежние значения, локальная сборка не меняется.
def proStorePass = System.getenv('KS_PASS_PRO_STORE') ?: 'viberlead'
def proKeyPass = System.getenv('KS_PASS_PRO_KEY') ?: 'viberlead'
def liteStorePass = System.getenv('KS_PASS_LITE_STORE') ?: 'viberleadlite'
def liteKeyPass = System.getenv('KS_PASS_LITE_KEY') ?: 'viberleadlite'

android {
    namespace 'by.viberlead.app'
    compileSdk 34

    defaultConfig {
        applicationId "by.viberlead.app"
        minSdk 21
        targetSdk 34
        versionCode 39
        versionName "2.28"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ks = rootProject.file("keystore/viberlead.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword proStorePass
                keyAlias "viberlead"
                keyPassword proKeyPass
            }
        }
        lite {
            def ks = rootProject.file("keystore/viberlead-lite.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword liteStorePass
                keyAlias "viberleadlite"
                keyPassword liteKeyPass
            }
        }
    }

    flavorDimensions += "edition"
    productFlavors {
        pro {
            dimension "edition"
            buildConfigField "boolean", "LITE", "false"
            manifestPlaceholders = [appName: "Заявки в Viber"]
            def ks = rootProject.file("keystore/viberlead.jks")
            if (ks.exists()) signingConfig signingConfigs.release
        }
        lite {
            dimension "edition"
            applicationIdSuffix ".lite"
            versionNameSuffix "-lite"
            buildConfigField "boolean", "LITE", "true"
            manifestPlaceholders = [appName: "Заявки в Viber Лайт"]
            def ks = rootProject.file("keystore/viberlead-lite.jks")
            if (ks.exists()) signingConfig signingConfigs.lite
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            zipAlignEnabled true
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

// Внешних зависимостей в APK нет: приложение написано на чистой Java + Android SDK.
// Тестовые зависимости работают только на JVM в CI и в приложение не попадают.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
